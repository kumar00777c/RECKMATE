services:
  - type: web
    name: reckmate
    runtime: node
    plan: free
    buildCommand: npm --prefix RECKMATE_v1_1/backend install
    startCommand: node RECKMATE_v1_1/backend/server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
